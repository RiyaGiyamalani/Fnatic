<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="32" fill="#1b5e20"/>
  <!-- Leaf / agriculture motif -->
  <g transform="translate(96,96)">
    <!-- Main leaf -->
    <path d="M-8,-60 C-8,-60 -50,-20 -50,20 C-50,44 -32,60 -8,60 C16,60 34,44 34,20 C34,-20 -8,-60 -8,-60 Z"
          fill="#4caf50" opacity="0.9"/>
    <!-- Leaf vein -->
    <line x1="-8" y1="-50" x2="-8" y2="50" stroke="#1b5e20" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="-20" x2="-30" y2="0" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-28" y2="18" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="20" x2="-24" y2="34" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="-20" x2="14" y2="0" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="16" y2="18" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="20" x2="12" y2="34" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <!-- Small second leaf -->
    <path d="M20,-40 C20,-40 40,-15 38,8 C36,24 24,30 14,24 C4,18 6,-10 20,-40 Z"
          fill="#81c784" opacity="0.8"/>
  </g>
  <!-- "RS" text at bottom -->
  <text x="96" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#a5d6a7">RS</text>
</svg>
